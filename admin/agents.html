<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents — ApnaGhar Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo">
      <span class="logo-icon"><img src="images/logo-small.png" alt="Aura Synergy Realty Group logo" /></span>
      <div><span class="sidebar-logo-text">ApnaGhar</span><span class="sidebar-logo-version">ERP v2.0</span></div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar"><i class="fas fa-user-tie"></i></div>
      <div><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role" id="sidebarUserRole">Administrator</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <a class="nav-item" href="../website/index.html" style="padding:8px 0"><i class="fas fa-globe"></i> View Website</a>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div class="page-heading">Agents</div>
      </div>
      <div class="topbar-right"><button class="btn btn-primary" onclick="CRUD.openAdd()"><i class="fas fa-plus"></i> Add Agent</button></div>
    </header>
    <main class="admin-content" id="crudRoot"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../website/js/config.js"></script>
<script src="../website/js/api.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script src="media-upload.js"></script>
<script src="crud.js"></script>
<script>

CRUD.init({
  sheet: "AGENTS", idField: "agent_id", title: "Agent", plural: "Agents", icon: "fa-user-tie", module: "Agents",
  kpis: [
    { label: "Total Agents", icon: "fa-user-tie", color: "navy", value: r => r.length },
    { label: "Active", icon: "fa-check-circle", color: "green", value: r => r.filter(x => x.status === "Active").length },
  ],
  columns: [
    { label: "Photo", render: r => `<img class="thumb-sm" style="width:40px;border-radius:50%" src="${escapeHtml(getImageUrl(r.photo_url))}" referrerpolicy="no-referrer" />` },
    { label: "Agent", render: R.title("full_name", r => escapeHtml(r.agent_id)) },
    { label: "Mobile", render: r => r.mobile ? `<a href="tel:${escapeHtml(r.mobile)}">${escapeHtml(r.mobile)}</a>` : "—" },
    { label: "Area", field: "area" },
    { label: "RERA No.", field: "rera_agent_no" },
    { label: "Commission", render: r => r.commission_percent ? r.commission_percent + "%" : "—" },
    { label: "Status", render: R.badge("status") },
  ],
  defaults: { status: "Active" },
  fields: [
    { name: "full_name", label: "Full Name", required: true },
    { name: "mobile", label: "Mobile", type: "tel", required: true },
    { name: "email", label: "Email", type: "email" },
    { name: "rera_agent_no", label: "MahaRERA Agent No." },
    { name: "experience_years", label: "Experience (years)", type: "number" },
    { name: "area", label: "Working Area" },
    { name: "commission_percent", label: "Commission %", type: "number", step: "0.1" },
    { name: "joining_date", label: "Joining Date", type: "date" },
    { name: "status", label: "Status", type: "select", options: ["Active","Inactive"], blank: false },
    { name: "photo_url", label: "Photo", type: "image" },
  ],
});

</script>
</body>
</html>
